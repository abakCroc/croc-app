name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  debug:
    if: inputs.build_type == 'debug'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version-file: third_party/croc-src/go.mod

      - name: Setup Android NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14033849"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Resolve croc-mobile dependencies
        run: cd croc-mobile && go mod tidy

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease

      - name: Generate test signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore test-release.jks \
            -alias test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"

      - name: Sign APK
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name '*universal*release*.apk' | head -1)
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)/apksigner sign \
            --ks test-release.jks \
            --ks-pass pass:android \
            --ks-key-alias test \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/croc-app-debug.apk \
            "$UNSIGNED"

      - uses: actions/upload-artifact@v4
        with:
          name: croc-app-debug
          path: app/build/outputs/apk/release/croc-app-debug.apk

  release:
    if: inputs.build_type == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version-file: third_party/croc-src/go.mod

      - name: Setup Android NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14033849"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Resolve croc-mobile dependencies
        run: cd croc-mobile && go mod tidy

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | grep -o '[0-9]\+')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Sign APKs
        run: |
          SIGNING_TOOL="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)/apksigner"
          for UNSIGNED in app/build/outputs/apk/release/*-release-unsigned.apk; do
            FILENAME=$(basename "$UNSIGNED")
            if [[ "$FILENAME" == *universal* ]]; then
              OUT_NAME="croc-app.apk"
            elif [[ "$FILENAME" == *arm64-v8a* ]]; then
              OUT_NAME="croc-app-arm64.apk"
            elif [[ "$FILENAME" == *x86_64* ]]; then
              OUT_NAME="croc-app-amd64.apk"
            elif [[ "$FILENAME" == *armeabi-v7a* ]]; then
              OUT_NAME="croc-app-arm.apk"
            elif [[ "$FILENAME" == *x86* ]]; then
              OUT_NAME="croc-app-386.apk"
            else
              continue
            fi
            "$SIGNING_TOOL" sign \
              --ks release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "app/build/outputs/apk/release/$OUT_NAME" \
              "$UNSIGNED"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: croc-app-release
          path: |
            app/build/outputs/apk/release/croc-app.apk
            app/build/outputs/apk/release/croc-app-arm64.apk
            app/build/outputs/apk/release/croc-app-amd64.apk
            app/build/outputs/apk/release/croc-app-arm.apk
            app/build/outputs/apk/release/croc-app-386.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"
          if [ -f "$CHANGELOG" ]; then
            NOTES_FLAG="--notes-file $CHANGELOG"
          else
            NOTES_FLAG="--notes Release ${{ steps.version.outputs.name }}"
          fi
          gh release create "v${{ steps.version.outputs.name }}" \
            app/build/outputs/apk/release/croc-app.apk \
            app/build/outputs/apk/release/croc-app-arm64.apk \
            app/build/outputs/apk/release/croc-app-amd64.apk \
            app/build/outputs/apk/release/croc-app-arm.apk \
            app/build/outputs/apk/release/croc-app-386.apk \
            --title "croc-app v${{ steps.version.outputs.name }}" \
            $NOTES_FLAG
